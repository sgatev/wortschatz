<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#434C5E"/>
      <stop offset="1" stop-color="#2E3440"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1C2028" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- tile, on the macOS icon grid: 824×824 body inside a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="182.5" fill="none" stroke="#ECEFF4" stroke-opacity="0.07" stroke-width="3"/>
  <!-- a hand of three cards fanned from a point below the tile centre: die (red), das (green), der card in front -->
  <g transform="translate(-18 0)">
    <rect x="352" y="262" width="320" height="420" rx="42" fill="#BF616A" transform="rotate(-17 512 820)" filter="url(#lift)"/>
    <rect x="352" y="262" width="320" height="420" rx="42" fill="#A3BE8C" transform="rotate(-6 512 820)" filter="url(#lift)"/>
    <g transform="rotate(6 512 820)" filter="url(#lift)">
      <rect x="352" y="262" width="320" height="420" rx="42" fill="#ECEFF4"/>
      <!-- W in Frost blue (the der colour) -->
      <polyline points="413,372 465,560 512,438 559,560 611,372" fill="none" stroke="#5E81AC" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="430" y="612" width="164" height="18" rx="9" fill="#D8DEE9"/>
    </g>
  </g>
</svg>
